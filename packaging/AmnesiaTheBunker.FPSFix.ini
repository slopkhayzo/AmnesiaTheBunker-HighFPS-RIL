; AmnesiaTheBunker.FPSFix configuration
; Keep this file beside AmnesiaTheBunker.FPSFix.asi. Changes apply on the next
; launch.

[General]
; false disables the fix completely without removing any file.
Enabled = true
; Writes detailed counters to AmnesiaTheBunker.FPSFix.log every few seconds.
; Nothing else changes. Turn on only when reporting a problem.
Diagnostics = false

[Features]
; Lets the game draw faster than its simulation rate. Everything below
; depends on it.
RenderUnlock = true
; Built-in frame limiter, at TargetFPS under [Timing]. Frame pacing
; (FramePacingEvenness) only works with it. Set to false to use VSync or an
; external limiter instead.
PresentationLimiter = true
; Smooths the camera between simulation ticks, including scripted cameras.
CameraInterpolation = true
; Smooths the first-person body, held items and things attached to them.
; Requires CameraInterpolation.
HandsRootInterpolation = true
; Smooths the first-person body's animation (arms, hands, held-item rigs).
; Requires HandsRootInterpolation.
HandsPoseInterpolation = true
; Smooths objects in the world: props, doors, drawers, thrown and carried
; things, lights and their shadows. Requires HandsRootInterpolation.
WorldRootInterpolation = true
; Smooths the animation of creatures, characters and animated props.
; Requires WorldRootInterpolation.
WorldPoseInterpolation = true
; Smooths particles: smoke, sparks, fire, dust. Requires
; HandsRootInterpolation.
ParticleInterpolation = true
; Mouse look shown at the frame rate instead of the simulation rate.
; Requires WorldRootInterpolation.
MousePreview = true
; Menu, pause-menu and inventory cursors, with dragged items, drawn at the
; frame rate.
MouseOverlay = true

; Not implemented. Setting either to true disables the whole fix.
RagdollPoseInterpolation = false
ImageTrailTiming = false

[Timing]
; Frame rate for PresentationLimiter. 0 uses the refresh rate of the primary
; display; 1..1000 sets a rate.
TargetFPS = 0
; 0..100: how even the frame times should be. Only with PresentationLimiter.
; The frame that runs a simulation tick takes longer than the others, so a
; plain cap shows one long frame per tick, which looks like judder.
;   0   plain cap at TargetFPS: highest frame rate, uneven frame times.
;   100 every frame the same length: lowest frame rate, perfectly even.
; In between, the fix shows as many frames per tick as it can while the tick
; frame stays within (100 - value) percent of the others' length, never more
; than TargetFPS. When a scene gets heavier the tick frame is stretched
; first; a frame per tick is given up only once it is more than twice that
; far over. The frame rate therefore moves in whole frames per tick: 120,
; 180, 240, 300 and so on at a 60 Hz simulation.
FramePacingEvenness = 0
; Holds the simulation at 60 or 120 Hz whatever the game's Framerate option
; says; 0 keeps the rate that option chooses. 60 leaves the most room for
; extra frames and gives the game's 60 FPS physics behaviour. 120 responds a
; little faster, but a simulation step then leaves room for only one or two
; frames, so the frame rate stays between 120 and 240.
GameplayRateOverride = 60
