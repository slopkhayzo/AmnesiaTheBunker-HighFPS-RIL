; Opt-in development proof for the render-scoped camera transaction.
; The probe stages the camera's current pose unchanged, lets RenderAll consume
; it, then restores and byte-verifies only the proven derived cache regions.

[General]
Enabled = true
Diagnostics = true

[Telemetry]
Enabled = true
MotionTrace = true
CameraRestoreProbe = true
HandsTrace = false
ReportIntervalSeconds = 5

[Features]
RenderUnlock = true
PresentationLimiter = true
CameraInterpolation = false
HandsRootInterpolation = false
WorldRootInterpolation = false
HandsPoseInterpolation = false
WorldPoseInterpolation = false
RagdollPoseInterpolation = false
ParticleInterpolation = false
ImageTrailTiming = false
MouseOverlay = false

[Timing]
TargetFPS = 240
GameplayRateOverride = 0
