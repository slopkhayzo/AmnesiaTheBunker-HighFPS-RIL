; Opt-in development profile for live PresentationLimiter validation.
; The engine render gate is disabled by RenderUnlock, while the plugin caps
; presentation independently at 240 FPS. GameplayUpdateRate is not modified.

[General]
Enabled = true
Diagnostics = true

[Telemetry]
Enabled = true
MotionTrace = false
HandsTrace = false
ReportIntervalSeconds = 5

[Features]
RenderUnlock = true
PresentationLimiter = true
CameraInterpolation = false
HandsRootInterpolation = false
WorldRootInterpolation = false
HandsPoseInterpolation = false
WorldPoseInterpolation = false
RagdollPoseInterpolation = false
ParticleInterpolation = false
ImageTrailTiming = false
MouseOverlay = false

[Timing]
TargetFPS = 240
GameplayRateOverride = 0
