; First visual proof of renderer-returned first-person root interpolation.
; Only a renderer-matched mesh owner within one metre is eligible. The plugin
; returns its own matrix and never writes a game object or matrix cache.

[General]
Enabled = true
Diagnostics = true

[Telemetry]
Enabled = true
MotionTrace = true
CameraRestoreProbe = false
HandsTrace = true
HandsRenderCopyProbe = false
HandsRestoreProbe = false
ReportIntervalSeconds = 5

[Features]
RenderUnlock = true
PresentationLimiter = true
CameraInterpolation = true
HandsRootInterpolation = true
WorldRootInterpolation = false
HandsPoseInterpolation = false
WorldPoseInterpolation = false
RagdollPoseInterpolation = false
ParticleInterpolation = false
ImageTrailTiming = false
MouseOverlay = false

[Timing]
TargetFPS = 240
GameplayRateOverride = 0
