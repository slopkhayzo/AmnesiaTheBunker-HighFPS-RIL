; Read-only renderer trace for first-person hands and attached equipment.
; cSubMeshEntity::GetModelMatrix is hooked pass-through: the original matrix
; pointer is returned unchanged and no entity or renderer state is written.

[General]
Enabled = true
Diagnostics = true

[Telemetry]
Enabled = true
MotionTrace = true
CameraRestoreProbe = false
HandsTrace = true
HandsRenderCopyProbe = false
ReportIntervalSeconds = 5

[Features]
RenderUnlock = true
PresentationLimiter = true
CameraInterpolation = true
HandsRootInterpolation = false
WorldRootInterpolation = false
HandsPoseInterpolation = false
WorldPoseInterpolation = false
RagdollPoseInterpolation = false
ParticleInterpolation = false
ImageTrailTiming = false
MouseOverlay = false

[Timing]
TargetFPS = 240
GameplayRateOverride = 0
