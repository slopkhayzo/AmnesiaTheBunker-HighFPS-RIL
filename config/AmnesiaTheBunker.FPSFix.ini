; AmnesiaTheBunker.FPSFix development configuration
; Keep this file beside AmnesiaTheBunker.FPSFix.asi.

[General]
Enabled = true
Diagnostics = true

[Telemetry]
; Opt-in read-only cadence/update counters for the exact supported GOG build.
Enabled = false
MotionTrace = false
HandsTrace = false
HandsRenderCopyProbe = false
HandsPoseRestoreProbe = false
HandsPoseRenderCopyProbe = false
HandsRestoreProbe = false
; Development-only identical-pose save/render/restore integrity proof.
CameraRestoreProbe = false
ReportIntervalSeconds = 5

[Features]
; Opt-in render unlock is implemented for the exact supported build.
; It preserves the game's configured GameplayUpdateRate.
RenderUnlock = false
; Requires RenderUnlock=true and TargetFPS greater than zero.
PresentationLimiter = false
; Requires telemetry and RenderUnlock; still under focused live validation.
CameraInterpolation = false
HandsRootInterpolation = false
WorldRootInterpolation = false
HandsPoseInterpolation = false
WorldPoseInterpolation = false
RagdollPoseInterpolation = false
; Particles drawn between their last two simulated positions. Requires
; HandsRootInterpolation (and with it the camera layer).
ParticleInterpolation = false
ImageTrailTiming = false
; Menu and inventory cursor drawn at the frame rate instead of once per
; simulation tick. Requires [Telemetry] MouseTrace. Clicks and hover are
; unchanged.
MouseOverlay = false

[Timing]
; Used only by PresentationLimiter. Supported range: 1..1000 FPS.
TargetFPS = 0
; Opt-in. 0 keeps the rate chosen by the game's own Framerate option.
; 60 or 120 holds the simulation at that stock rate while presentation
; stays at TargetFPS. 60 gives the game's 60 FPS physics behaviour at the
; cost of more input latency. Requires RenderUnlock.
GameplayRateOverride = 0
; Only with PresentationLimiter. 0..100: how even the frame times should be.
; The frame that runs a simulation tick takes longer than the others, so a
; plain cap shows one long frame per tick, which looks like judder.
;   0   plain cap at TargetFPS: highest frame rate, uneven frame times.
;   100 every frame the same length: lowest frame rate, perfectly even.
; In between, the plugin presents as many frames per tick as it can while
; the tick frame stays within (100 - value) percent of the others' length,
; never more than TargetFPS. When a scene gets heavier the tick frame is
; stretched first; a frame per tick is given up only once it is more than
; twice that far over. The frame rate moves in whole frames per tick (120,
; 180, 240, 300 at a 60 Hz simulation).
FramePacingEvenness = 0
