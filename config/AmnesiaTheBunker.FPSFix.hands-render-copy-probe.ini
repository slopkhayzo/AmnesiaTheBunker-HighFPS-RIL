; Renderer return-path proof for the near-camera first-person mesh.
; The hook returns a byte-exact copy of the original model matrix from aligned
; plugin-owned storage. It does not alter any game object or matrix cache.

[General]
Enabled = true
Diagnostics = true

[Telemetry]
Enabled = true
MotionTrace = true
CameraRestoreProbe = false
HandsTrace = true
HandsRenderCopyProbe = true
HandsRestoreProbe = false
ReportIntervalSeconds = 5

[Features]
RenderUnlock = true
PresentationLimiter = true
CameraInterpolation = true
HandsRootInterpolation = false
WorldRootInterpolation = false
HandsPoseInterpolation = false
WorldPoseInterpolation = false
RagdollPoseInterpolation = false
ParticleInterpolation = false
ImageTrailTiming = false
MouseOverlay = false

[Timing]
TargetFPS = 240
GameplayRateOverride = 0
