; Baseline for measuring the plugin's own cost: the same frame-rate unlock,
; limiter, pacing and 60 Hz simulation as the play profile, with every trace
; and interpolation layer off. The view is stepped. Compare its frame trace
; with a play run's using tools\analyze_frames.py.

[General]
Enabled = true
Diagnostics = true

[Telemetry]
Enabled = true
; Read-only camera sampling, kept so the frame trace can tell gameplay from
; menus.
MotionTrace = true
CameraRestoreProbe = false
HandsTrace = false
HandsRenderCopyProbe = false
HandsPoseRestoreProbe = false
HandsPoseRenderCopyProbe = false
HandsRestoreProbe = false
WorldTrace = false
MouseTrace = false
FrameTrace = true
ReportIntervalSeconds = 5

[Features]
RenderUnlock = true
PresentationLimiter = true
CameraInterpolation = false
HandsRootInterpolation = false
WorldRootInterpolation = false
HandsPoseInterpolation = false
WorldPoseInterpolation = false
RagdollPoseInterpolation = false
ParticleInterpolation = false
ImageTrailTiming = false
MouseOverlay = false
MousePreview = false

[Timing]
TargetFPS = 350
GameplayRateOverride = 60
FramePacingEvenness = 50
