; Opt-in development profile for read-only current-listener camera tracing.
; No camera or gameplay state is modified by MotionTrace.

[General]
Enabled = true
Diagnostics = true

[Telemetry]
Enabled = true
MotionTrace = true
CameraRestoreProbe = false
HandsTrace = false
ReportIntervalSeconds = 5

[Features]
RenderUnlock = true
PresentationLimiter = true
CameraInterpolation = false
HandsRootInterpolation = false
WorldRootInterpolation = false
HandsPoseInterpolation = false
WorldPoseInterpolation = false
RagdollPoseInterpolation = false
ParticleInterpolation = false
ImageTrailTiming = false
MouseOverlay = false

[Timing]
TargetFPS = 240
GameplayRateOverride = 0
