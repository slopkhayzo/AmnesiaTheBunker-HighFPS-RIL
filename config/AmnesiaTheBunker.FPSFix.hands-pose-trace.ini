; Read-only final skin-palette trace for the visible first-person hands.
; The proven camera and held-item root interpolation remain active. The new
; trace hashes both the live affine matrices and the final renderer-facing
; dual-quaternion palette. Every original pointer is returned unchanged and no
; palette bytes are substituted or written.

